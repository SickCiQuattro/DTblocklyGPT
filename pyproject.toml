[tool.poetry]
name = "DTblocklyGPT"
version = "1.0.0"
description = "End-user development of collaborative robot tasks: Blockly editor, LLM assistant and Gazebo digital twin for the Denso COBOTTA"
authors = ["Filippo Camossi", "Luigi Gargioni <luigi.gargioni@gmail.com>"]
maintainers = ["Filippo Camossi"]
readme = "README.md"
homepage = "http://localhost:3000/"
repository = "https://github.com/SickCiQuattro/DTblocklyGPT"
documentation = "https://github.com/SickCiQuattro/DTblocklyGPT#readme"
packages = [
    { include="poetry_scripts", from="./backend" },
]

[tool.poetry.scripts]
start = "backend.poetry_scripts.server:start"
collectstatic = "backend.poetry_scripts.server:collectstatic"
poetryup = "backend.poetry_scripts.server:poetryup"
migrate = "backend.poetry_scripts.server:migrate"
makemigrations = "backend.poetry_scripts.server:makemigrations"

[tool.poetry.dependencies]
django = "^6.0"
django-cors-headers = "^4.7.0"
django-mysql = "^4.19"
numpy = "^2.3.1"
openai = "^3.32.0"
opencv-python = "^4.11.0.86"
pillow = "^12.2.0"
python = ">=3.12,<3.14"
python-dotenv = "^1.1.0"
pywin32 = {version = "^311", markers = "sys_platform == 'win32'"}
hand-gesture-engine = "^0.1.1"
ultralytics = "^8.4.62"
pyyaml = "^6.0.3"
torchvision = "^0.27.0"
# Exact pin, not a caret range, and deliberately so: nothing in this project
# imports mediapipe directly — it is a transitive dependency of
# hand-gesture-engine, which declares it without a version bound. PyPI is on
# 1.x, so without this line a fresh `poetry lock` would pull a new major of the
# vision library the gesture pipeline runs on (vision_live.py::GestureEngine)
# with nothing here to catch the change. Bump it only alongside a gesture
# re-validation, not as routine housekeeping.
mediapipe = "0.10.14"
ikpy = "^3.4.2"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
flake8 = "^7.3.0"
poetry-plugin-up = "^0.6.0"
pytest = "^9.0.3"
pytest-django = "^4.12.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
