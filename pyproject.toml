[tool.poetry]
name = "DTblocklyGPT"
version = "1.0.0"
description = "Pharmaceutical Robotic and AI System for End"
authors = ["Luigi Gargioni <luigi.gargioni@gmail.com>"]
maintainers = ["Luigi Gargioni <luigi.gargioni@gmail.com>"]
readme = "README.md"
homepage = "http://localhost:3000/"
repository = "https://github.com/luigigargioni/DTblocklyGPT"
documentation = "https://github.com/luigigargioni/DTblocklyGPT#readme"
packages = [
    { include="poetry_scripts", from="./backend" },
]

[tool.poetry.scripts]
start = "backend.poetry_scripts.server:start"
collectstatic = "backend.poetry_scripts.server:collectstatic"
poetryup = "backend.poetry_scripts.server:poetryup"
migrate = "backend.poetry_scripts.server:migrate"
makemigrations = "backend.poetry_scripts.server:makemigrations"

[tool.poetry.dependencies]
django = "^6.0"
django-cors-headers = "^4.7.0"
django-mysql = "^4.19"
numpy = "^2.3.1"
openai = "^2.31.0"
opencv-python = "^4.11.0.86"
pillow = "^12.2.0"
python = ">=3.12,<3.14"
python-dotenv = "^1.1.0"
pytz = "^2026.1.post1"
pywin32 = {version = "^311", markers = "sys_platform == 'win32'"}
rapidfuzz = "^3.13.0"
pydantic-core = "^2.45.0"
hand-gesture-engine = "^0.1.1"
ultralytics = "^8.4.62"
pyyaml = "^6.0.3"
torchvision = "^0.27.0"
mediapipe = "0.10.14"
ikpy = "^3.4.2"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
flake8 = "^7.3.0"
poetry-plugin-up = "^0.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyrefly]
# Pin Pyrefly (Antigravity's Python LSP) to the Poetry virtualenv so imports resolve.
python-interpreter = "/home/filippo/.cache/pypoetry/virtualenvs/dtblocklygpt-Ryf0IepQ-py3.12/bin/python"