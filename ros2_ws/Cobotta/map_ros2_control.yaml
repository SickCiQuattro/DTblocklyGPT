# ros_gz_bridge config for the ros2_control flow: only the sim clock and the camera.
# Joint commands and /joint_states are handled by ros2_control, not bridged.

# Sim clock — required so ROS nodes with use_sim_time:=true advance.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  qos_profile: CLOCK

# Overhead camera stream. Reliable/default QoS — required to match
# web_video_server's subscription (ros2_ws/src/web_video_server), which
# expects RELIABLE. A prior attempt to set this to SENSOR_DATA (best-effort,
# the usual profile for camera topics) broke the frontend feed entirely: gz
# bridge and web_video_server end up with incompatible QoS and ROS delivers
# zero messages between them (confirmed via the "requesting incompatible
# QoS... No messages will be sent" warning on both sides) — a silent black
# screen, not a crash. Left at default until/unless web_video_server's own
# subscription QoS is changed to match.
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/gz/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
