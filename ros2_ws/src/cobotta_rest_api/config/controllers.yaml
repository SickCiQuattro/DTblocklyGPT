# ros2_control controllers for the Cobotta digital twin. Loaded via the
# gz_ros2_control plugin in Cobotta.sdf (path substituted by the launch).
# Installed into the package share by setup.py — run `colcon build` after editing.
controller_manager:
  ros__parameters:
    update_rate: 500          # Hz; <= sim physics rate (1000 Hz / 1ms step). Tunable.
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

# Both fingers commanded symmetrically (Harmonic <mimic> has open issue #340).
gripper_controller:
  ros__parameters:
    joints:
      - joint_left
      - joint_right
    command_interfaces:
      - position
    state_interfaces:
      - position
